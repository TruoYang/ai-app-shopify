# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6a891d8e4d3a8ebc5706e099f72b3112"
name = "SmartCart RCM"
handle = "smartcart-rcm"
application_url = "https://smartcart-rcm.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

# orders/paid: stores new orders for training and attributes purchases to the widget (Phase 5).
[[webhooks.subscriptions]]
topics = [ "orders/paid" ]
uri = "/webhooks/orders/paid"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

# Mandatory privacy webhooks (app/routes/webhooks.compliance.jsx).
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,read_customers,write_customers,read_products,write_products,read_publications,write_publications,read_online_store_navigation,write_online_store_navigation,read_discounts,write_discounts"

[auth]
redirect_urls = [ "https://smartcart-rcm.onrender.com/api/auth" ]

# Storefront widget calls https://<shop>/apps/ai/recommend, forwarded to <app url>/apps/ai/recommend.
# "shopify app dev" swaps only the host for the current tunnel and keeps the /apps/ai path.
[app_proxy]
url = "https://smartcart-rcm.onrender.com/apps/ai"
subpath = "ai"
prefix = "apps"
