# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "241e113a3191bab772a80bb096d678ae"
name = "my-plugin-ai"
application_url = "https://my-plugin-ai.onrender.com"
embedded = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_products"

[auth]
redirect_urls = [
  "https://my-plugin-ai.onrender.com/auth/callback",
  "https://my-plugin-ai.onrender.com/auth/shopify/callback",
  "https://my-plugin-ai.onrender.com/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
