# Render Blueprint for SmartCart RCM (free plan). See my-plugin-ai/docs/DEPLOY.md.
services:
  - type: web
    name: smartcart-rcm
    runtime: docker
    rootDir: my-plugin-ai
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartcart-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_orders,write_orders,read_customers,write_customers,read_products,write_products,read_publications,write_publications,read_online_store_navigation,write_online_store_navigation,read_discounts,write_discounts

databases:
  - name: smartcart-db
    plan: free
    region: singapore
    databaseName: smartcart
    user: smartcart
